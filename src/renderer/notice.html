<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>GCP Remoto</title>
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    html, body { background: transparent !important; overflow: hidden; }
    body { padding: 14px; }
    .card { position: relative; border-radius: 22px; background: linear-gradient(180deg, #17223b 0%, #111a2e 100%); border: 1px solid #2f4268; box-shadow: 0 22px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset; overflow: hidden; animation: enter .35s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.97); } }
    .card.leave { animation: leave .22s ease forwards; }
    @keyframes leave { to { opacity: 0; transform: translateY(10px) scale(.98); } }
    .glow { position: absolute; inset: -40% -20% auto; height: 220px; background: radial-gradient(closest-side, rgba(79,195,247,.28), transparent); pointer-events: none; }
    .card.warn .glow { background: radial-gradient(closest-side, rgba(255,93,93,.25), transparent); }
    .drag { -webkit-app-region: drag; }
    .nodrag { -webkit-app-region: no-drag; }

    /* Pedido de acesso */
    .rq { padding: 22px 24px 20px; position: relative; }
    .rq-top { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
    .rq-top img { width: 26px; height: 26px; border-radius: 8px; }
    .rq-top .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: #ffb547; }
    .rq-top .live i { width: 8px; height: 8px; border-radius: 50%; background: #ffb547; animation: pulse 1.2s infinite; box-shadow: 0 0 0 3px rgba(255,181,71,.25); }
    .who { display: flex; align-items: center; gap: 16px; margin: 20px 0 6px; }
    .avatar { position: relative; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--grad); box-shadow: 0 10px 30px rgba(79,195,247,.35); flex: none; }
    .avatar .ic { width: 32px; height: 32px; color: #fff; }
    .avatar::after { content: ""; position: absolute; inset: -6px; border-radius: 24px; border: 2px solid rgba(79,195,247,.5); animation: ring 1.8s infinite; }
    @keyframes ring { 0% { opacity: .9; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.18); } }
    .who h1 { margin: 0; font-size: 21px; letter-spacing: -.01em; line-height: 1.2; }
    .who p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .question { margin: 16px 0 14px; font-size: 15px; line-height: 1.5; color: #d7e0f0; }
    .question b { color: #fff; }
    .perms { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .perm { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(8,14,26,.55); border: 1px solid #263552; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .perm .switch { width: 36px; height: 20px; }
    .perm .switch span::before { width: 14px; height: 14px; }
    .perm .switch input:checked + span::before { transform: translateX(16px); }
    .badge-pw { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; background: rgba(61,220,151,.12); color: #3ddc97; border: 1px solid rgba(61,220,151,.35); }
    .actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 18px; }
    .actions .btn { height: 48px; font-size: 15px; border-radius: 14px; }
    .btn.accept { background: linear-gradient(135deg, #3ddc97, #2bb8d6); border: 0; color: #04241b; box-shadow: 0 10px 28px rgba(61,220,151,.3); }
    .btn.accept:hover { filter: brightness(1.08); }
    .countdown { margin-top: 14px; display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12px; }
    .countdown .bar { flex: 1; height: 4px; border-radius: 4px; background: #22314f; overflow: hidden; }
    .countdown .bar i { display: block; height: 100%; background: var(--grad); transition: width 1s linear; }
    .sec-note { margin-top: 10px; font-size: 11.5px; color: var(--dim); line-height: 1.4; }

    /* Aviso */
    .inf { display: flex; gap: 14px; padding: 16px 16px 16px 18px; align-items: flex-start; position: relative; }
    .inf .badge { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: rgba(79,195,247,.15); color: var(--accent); }
    .inf.ok .badge { background: rgba(61,220,151,.14); color: #3ddc97; }
    .inf.warn .badge { background: rgba(255,93,93,.14); color: #ff7b7b; }
    .inf .badge .ic { width: 24px; height: 24px; }
    .inf h2 { margin: 2px 0 4px; font-size: 15.5px; }
    .inf p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .inf .meta { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .inf .meta span { font: 600 11px var(--mono); color: #aab6cc; background: rgba(8,14,26,.6); border: 1px solid #263552; border-radius: 8px; padding: 3px 8px; }
    .inf .x { margin-left: auto; }
    .inf .life { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--grad); width: 100%; animation: life linear forwards; }
    @keyframes life { to { width: 0; } }
    .pname { color: #dfe6f3 !important; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px !important; }
    .pbar { height: 7px; border-radius: 7px; background: #22314f; overflow: hidden; margin-bottom: 8px; }
    .pbar i { display: block; height: 100%; background: linear-gradient(90deg, #4fc3f7, #7c6cff); transition: width .2s; }
    .pside { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .pside .btn.sm { white-space: nowrap; }
    .pactions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .ppct { font: 800 20px var(--mono); color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="lib/ui.js"></script>
  <script src="notice.js"></script>
</body>
</html>
